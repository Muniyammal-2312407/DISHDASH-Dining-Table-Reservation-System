  <!-- Text -->
  <text x="300" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#463228" text-anchor="middle">DISHDASH</text>
  <text x="300" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#8C786E" text-anchor="middle">Freshly Prepared Cuisine</text>
