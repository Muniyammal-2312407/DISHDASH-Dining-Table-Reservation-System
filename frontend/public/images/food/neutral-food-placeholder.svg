      <stop offset="0%" stop-color="#F8F4EE" />
      <stop offset="100%" stop-color="#EBE2D6" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <g transform="translate(300, 160)">
